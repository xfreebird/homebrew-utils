name: Update eSemnBun packages
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: write
concurrency:
  group: esemnbun-package-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/update-esemnbun.py
      - run: ruby -c esemnbun-cli.rb
      - name: Save updated definitions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esemnbun-cli.rb bucket/esemnbun-cli.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update eSemnBun CLI packages'
            git push
          fi
  homebrew:
    needs: update
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Install and test published CLI
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap xfreebird/utils "$GITHUB_WORKSPACE"
          brew install xfreebird/utils/esemnbun-cli
          brew test xfreebird/utils/esemnbun-cli
          test -x "$(brew --prefix)/bin/esemnbun-mcp"
  scoop:
    needs: update
    runs-on: windows-latest
    steps:
      - name: Install Scoop and verify public CLI package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://get.scoop.sh -OutFile install-scoop.ps1
          & ./install-scoop.ps1 -RunAsAdmin -ScoopDir "$env:RUNNER_TEMP/scoop"
          if ($LASTEXITCODE -ne 0) { throw 'Scoop setup failed' }
          $scoop = "$env:RUNNER_TEMP/scoop/shims/scoop.ps1"
          & $scoop bucket add esemnbun https://github.com/xfreebird/homebrew-utils
          if ($LASTEXITCODE -ne 0) { throw 'Bucket setup failed' }
          & $scoop install esemnbun/esemnbun-cli
          if ($LASTEXITCODE -ne 0) { throw 'Scoop installation failed' }
          & "$env:RUNNER_TEMP/scoop/shims/esemnbun.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke check failed' }
          & $scoop uninstall esemnbun-cli
          if ($LASTEXITCODE -ne 0) { throw 'Scoop uninstall failed' }
